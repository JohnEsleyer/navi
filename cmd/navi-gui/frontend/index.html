<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navi AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <!-- Official Navi Brand Icon: Concept 3 (The Wayfinder Spark) -->
        <div class="brand-icon-wrapper">
          <svg class="brand-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="naviSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00e5ff"/>
                <stop offset="50%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#9d4edd"/>
              </linearGradient>
              <radialGradient id="sparkHalo" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="46" fill="url(#sparkHalo)"/>
            <path d="M50 10 Q50 50 10 50 Q50 50 50 90 Q50 50 90 50 Q50 50 50 10 Z" fill="url(#naviSparkGrad)"/>
            <circle cx="50" cy="50" r="7.5" fill="#0b0d13" stroke="#00e5ff" stroke-width="2.5"/>
            <circle cx="28" cy="28" r="3" fill="#00e5ff" opacity="0.8"/>
            <circle cx="72" cy="72" r="3" fill="#9d4edd" opacity="0.8"/>
          </svg>
        </div>
        <span class="title">NAVI</span>
        <span class="badge" id="stats-cost">$0.000000</span>
      </div>

      <div class="actions">
        <!-- Model Selection Dropdown -->
        <div class="custom-dropdown" id="model-dropdown">
          <button class="dropdown-trigger" id="model-trigger">
            <!-- CPU / Model Chip Icon -->
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="2"/>
              <rect x="9" y="9" width="6" height="6"/>
              <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
              <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
              <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="15" x2="23" y2="15"/>
              <line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="15" x2="4" y2="15"/>
            </svg>
            <span id="current-model">llama-3.1-8b-instant</span>
            <!-- Chevron Down Icon -->
            <svg class="ui-icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="dropdown-menu" id="model-menu">
            <div class="dropdown-item" data-value="llama-3.1-8b-instant">llama-3.1-8b-instant (Groq)</div>
            <div class="dropdown-item" data-value="gpt-4o-mini">gpt-4o-mini (OpenAI)</div>
            <div class="dropdown-item" data-value="deepseek-chat">deepseek-chat</div>
            <div class="dropdown-item" data-value="llama3.2:1b">llama3.2:1b (Local)</div>
          </div>
        </div>

        <!-- Copy Context Button -->
        <button class="btn" id="btn-copy-context" title="Copy context window to clipboard">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copy Context</span>
        </button>

        <!-- Dump to .txt Button -->
        <button class="btn" id="btn-dump-context" title="Dump context to disk (.txt)">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Dump .txt</span>
        </button>

        <!-- Clear Memory Button -->
        <button class="btn btn-danger" id="btn-clear-context" title="Clear context buffer">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <span>Clear</span>
        </button>
      </div>
    </header>

    <!-- Chat Stream -->
    <main class="chat-container" id="chat-box">
      <div class="message system">
        <div class="bubble">Navi harness initialized. Context window active.</div>
      </div>
    </main>

    <!-- Bottom Input Area -->
    <footer class="input-panel">
      <!-- Puppet Mode (Pretend to be AI) Toggle -->
      <div class="role-selector">
        <label class="toggle-container" title="When active, you write responses as the AI without making API calls.">
          <input type="checkbox" id="puppet-mode-toggle">
          <span class="slider"></span>
          <span class="toggle-content">
            <svg class="ui-icon mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="toggle-label" id="role-label">Mode: User</span>
          </span>
        </label>
      </div>

      <div class="input-wrapper">
        <textarea id="prompt-input" rows="1" placeholder="Type a message or press Shift+Enter for newline..."></textarea>
        <button id="btn-send" class="btn-send" title="Send message">
          <!-- Send Paper Plane Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Custom Alert/Confirm Modal -->
  <div class="custom-modal-backdrop" id="custom-modal">
    <div class="custom-modal-card">
      <h3 id="modal-title">Notice</h3>
      <p id="modal-body">This is a custom dialog.</p>
      <div class="modal-actions" id="modal-actions">
        <button class="btn btn-primary" id="modal-btn-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Custom Toast Notifications Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
